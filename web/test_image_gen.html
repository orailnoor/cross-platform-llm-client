<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU Image Gen Test — CyberRealistic</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #fff;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
        }
        h1 { font-size: 20px; margin: 0 0 8px; }
        .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; }
        .card {
            background: #141414;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            max-width: 600px;
        }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            background: #1c1c1e;
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #0a84ff; }
        button {
            background: #0a84ff;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
        button:disabled { background: #333; cursor: not-allowed; }
        .status {
            margin-top: 12px;
            font-size: 13px;
            color: #888;
            font-family: 'SF Mono', monospace;
            white-space: pre-wrap;
        }
        .error { color: #ff453a; }
        .success { color: #30d158; }
        #output {
            margin-top: 20px;
            max-width: 600px;
        }
        #output img {
            width: 100%;
            border-radius: 12px;
            border: 1px solid #222;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 2px;
            margin-top: 12px;
            overflow: hidden;
        }
        .progress-bar > div {
            height: 100%;
            background: #0a84ff;
            width: 0%;
            transition: width 0.2s;
        }
    </style>
</head>
<body>
    <h1>🎨 WebGPU Image Generation Test</h1>
    <div class="subtitle">Model: CyberRealistic-LCM · Backend: WebGPU (Metal on Apple)</div>

    <div class="card">
        <label>Prompt</label>
        <input type="text" id="prompt" value="a portrait of a cyberpunk woman, neon lights, detailed, 8k" placeholder="Enter prompt...">
        <button id="generateBtn" onclick="startGeneration()">Generate</button>
        <div class="progress-bar"><div id="progress"></div></div>
        <div class="status" id="status">Click Generate to start.</div>
    </div>

    <div id="output"></div>

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0/dist/transformers.min.js';

        let pipe = null;
        let isReady = false;

        const statusEl = document.getElementById('status');
        const btn = document.getElementById('generateBtn');
        const progressEl = document.getElementById('progress');

        function log(msg, type = 'info') {
            console.log('[Test]', msg);
            const line = document.createElement('div');
            line.textContent = msg;
            if (type === 'error') line.className = 'error';
            if (type === 'success') line.className = 'success';
            statusEl.appendChild(line);
        }

        async function init() {
            btn.disabled = true;
            statusEl.innerHTML = '';
            log('Initializing pipeline...');
            log('Loading CyberRealistic-LCM-amuse (this may take 30-60s on first run)...');

            try {
                // Try CyberRealistic first
                pipe = await pipeline('text-to-image', 'TensorStack/CyberRealistic-LCM-amuse', {
                    device: 'webgpu',
                });
                isReady = true;
                log('✅ CyberRealistic loaded with WebGPU!', 'success');
            } catch (e) {
                log('⚠️ CyberRealistic failed: ' + e.message, 'error');
                log('Falling back to Xenova/dreamshaper-8-lcm...');
                try {
                    pipe = await pipeline('text-to-image', 'Xenova/dreamshaper-8-lcm', {
                        device: 'webgpu',
                    });
                    isReady = true;
                    log('✅ DreamShaper loaded with WebGPU!', 'success');
                } catch (err) {
                    log('❌ Fallback also failed: ' + err.message, 'error');
                    log('Your browser may not support WebGPU. Try Chrome 113+ or Safari 17.4+.', 'error');
                }
            }
            btn.disabled = !isReady;
        }

        window.startGeneration = async () => {
            if (!isReady || !pipe) {
                log('Engine not ready.', 'error');
                return;
            }

            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) return;

            btn.disabled = true;
            statusEl.innerHTML = '';
            progressEl.style.width = '0%';
            log('Generating: ' + prompt);

            try {
                const output = await pipe(prompt, {
                    negative_prompt: '',
                    num_inference_steps: 4,
                    callback_on_step_end: (p, step_index, timestep, callback_kwargs) => {
                        const pct = ((step_index + 1) / 4) * 100;
                        progressEl.style.width = pct + '%';
                        log(`Step ${step_index + 1}/4`);
                        return callback_kwargs;
                    }
                });

                const image = output.images[0];
                const canvas = document.createElement('canvas');
                canvas.width = image.width;
                canvas.height = image.height;
                const ctx = canvas.getContext('2d');
                const imgData = new ImageData(
                    new Uint8ClampedArray(image.data),
                    image.width,
                    image.height
                );
                ctx.putImageData(imgData, 0, 0);

                const base64 = canvas.toDataURL('image/png');
                const out = document.getElementById('output');
                out.innerHTML = `<img src="${base64}" alt="Generated">`;
                log(`✅ Done! ${image.width}x${image.height}`, 'success');
            } catch (e) {
                log('❌ Generation failed: ' + e.message, 'error');
            }

            btn.disabled = false;
        };

        // Auto-init on load
        init();
    </script>
</body>
</html>


name: Build PrivateLM iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15-intel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get
      - name: Build llama.cpp for iOS
        run: |
              brew install ninja cmake
              bash local_plugins/llama_flutter_android/scripts/build_llama_ios.sh
      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS without signing
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry PrivateLM-unsigned.ipa Payload

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-iOS-unsigned
          path: PrivateLM-unsigned.ipa
          retention-days: 7
